    <h1>Birim Dönüştürücü</h1>
    <p>Seçilen dönüşüm türüne göre değeri otomatik olarak hesaplar.</p>
  </header>

  <main class="week-page">
    <section class="week-card">
      <h2>Dönüşüm Formu</h2>
      <div class="modern-form">
        <div class="form-group">
          <label for="value">Değer</label>
          <input type="number" id="value" placeholder="Dönüştürülecek değeri giriniz">
        </div>
        <div class="form-group">
          <label for="type">Dönüşüm Tipi</label>
          <select id="type">
            <option value="meterToKm">Metre → Kilometre</option>
            <option value="celsiusToFahrenheit">Celsius → Fahrenheit</option>
            <option value="kgToGram">Kilogram → Gram</option>
          </select>
        </div>
        <button type="button" class="modern-btn" onclick="donustur()">Hesapla</button>
      </div>
      <div id="convertResult" class="result-card" style="display:none;"></div>
    </section>
